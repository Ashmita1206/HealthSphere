name: HealthSphere Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================
  # Stage 1: Quality Checks (Install, Lint & TypeCheck)
  # ====================================================
  quality_checks:
    name: 🔍 Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Verify TypeScript Safety
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

  # ====================================================
  # Stage 2: Automated Tests
  # ====================================================
  automated_testing:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    needs: quality_checks
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Production Test Suites
        run: npm test -- --no-file-parallelism

  # ====================================================
  # Stage 3: Production Build
  # ====================================================
  production_build:
    name: 📦 Production Bundle Build
    runs-on: ubuntu-latest
    needs: automated_testing
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Optimized Frontend Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthsphere-dist
          path: dist/
          retention-days: 7

  # ====================================================
  # Stage 4: Docker Container Builds
  # ====================================================
  docker_validation:
    name: 🐳 Docker Container Validation
    runs-on: ubuntu-latest
    needs: production_build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: healthsphere-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: healthsphere-frontend:test

  # ====================================================
  # Stage 5: Deployment Ready Gate
  # ====================================================
  deployment_ready:
    name: 🚀 Deployment Ready Gate
    runs-on: ubuntu-latest
    needs: [quality_checks, automated_testing, production_build, docker_validation]
    steps:
      - name: Verification Confirmation
        run: |
          echo "===================================================="
          echo "HealthSphere AI Healthcare OS passed all CI gates!"
          echo "All tests, TypeScript checks, and Docker builds OK."
          echo "Status: READY FOR PRODUCTION DEPLOYMENT"
          echo "===================================================="
