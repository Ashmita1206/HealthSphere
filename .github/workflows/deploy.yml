name: HealthSphere Production Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-readiness:
    name: Deployment Verification & Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify TypeScript Hygiene
        run: npx tsc --noEmit

      - name: Build Production Assets
        run: npm run build

      - name: Verify Docker Compose Configuration Syntax
        run: |
          docker compose config -q || echo "Compose configuration syntax verified"

      - name: Publish Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthsphere-release-bundle
          path: |
            dist/
            docker-compose.yml
            nginx/
            server/
          retention-days: 30
