name: HealthSphere Enterprise Security Scanning

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday 02:00 UTC
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ====================================================
  # Dependency Vulnerability Audit
  # ====================================================
  dependency_security:
    name: 🛡️ Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high || true

      - name: Audit Backend Dependencies
        working-directory: server
        run: npm audit --audit-level=high || true

  # ====================================================
  # Static Code Security Analysis (SAST)
  # ====================================================
  code_security_scan:
    name: 🔒 Static Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Scan Secrets and Sensitive Tokens
        run: |
          echo "Scanning for hardcoded secrets or unencrypted private keys..."
          grep -rn "PRIVATE KEY" . --exclude-dir={node_modules,dist,.git} || true
          echo "Secret scan completed."
