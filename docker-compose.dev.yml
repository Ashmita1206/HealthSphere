# ====================================================
# HealthSphere Development Orchestration
# Services with Hot Reloading and Local Port Bindings
# ====================================================

services:
  mongodb:
    image: mongo:7.0
    container_name: healthsphere-dev-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthsphere_dev
    volumes:
      - dev_mongodb_data:/data/db
    networks:
      - healthsphere-dev-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: healthsphere-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    networks:
      - healthsphere-dev-network

  backend:
    image: node:20-alpine
    container_name: healthsphere-dev-backend
    working_dir: /app
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/healthsphere_dev
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: dev-secret-key-healthsphere-local
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - healthsphere-dev-network

  frontend:
    image: node:20-alpine
    container_name: healthsphere-dev-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:4000/api
      VITE_SOCKET_URL: http://localhost:4000
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - healthsphere-dev-network

networks:
  healthsphere-dev-network:
    driver: bridge

volumes:
  dev_mongodb_data:
  dev_redis_data:
