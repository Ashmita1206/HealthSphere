version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healthsphere_dev_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - dev_mongodb_data:/data/db
    networks:
      - healthsphere_dev_net

  redis:
    image: redis:7.2-alpine
    container_name: healthsphere_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    networks:
      - healthsphere_dev_net

  backend:
    image: node:20-alpine
    container_name: healthsphere_dev_backend
    working_dir: /app
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/healthsphere_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_healthsphere_2026
      CLIENT_URL: http://localhost:5173
      LOG_LEVEL: debug
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - healthsphere_dev_net
    depends_on:
      - mongodb
      - redis

  frontend:
    image: node:20-alpine
    container_name: healthsphere_dev_frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - healthsphere_dev_net
    depends_on:
      - backend

networks:
  healthsphere_dev_net:
    driver: bridge

volumes:
  dev_mongodb_data:
    driver: local
  dev_redis_data:
    driver: local
