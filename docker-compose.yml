version: '3.8'

services:
  # ----------------------------------------------------
  # Database Service: MongoDB
  # ----------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: healthsphere_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: healthsphere
    networks:
      - healthsphere_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # Cache Service: Redis
  # ----------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: healthsphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthsphere_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # Backend API & Socket Service
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: healthsphere_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/healthsphere
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-healthsphere_super_secure_enterprise_secret_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost,http://localhost:80,http://localhost:5173}
      LOG_LEVEL: info
    volumes:
      - app_logs:/app/logs
    networks:
      - healthsphere_net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # Frontend & Reverse Proxy: Nginx
  # ----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthsphere_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - healthsphere_net
    depends_on:
      - backend

networks:
  healthsphere_net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
