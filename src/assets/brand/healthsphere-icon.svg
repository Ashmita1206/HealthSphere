<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hs-sphere-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="hs-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="hs-ecg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container/Sphere Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#hs-sphere-bg)" />
  
  <!-- Subtle Inner Sphere Orbit Arc -->
  <circle cx="50" cy="50" r="34" stroke="url(#hs-ring)" stroke-width="3.5" stroke-dasharray="160 40" stroke-linecap="round" opacity="0.6" />
  
  <!-- ECG Heartbeat Pulse Line -->
  <path d="M 16 50 L 32 50 L 39 36 L 46 64 L 54 26 L 62 60 L 68 44 L 73 50 L 84 50" 
        stroke="url(#hs-ecg)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Sphere Accent Dots -->
  <circle cx="54" cy="26" r="3.5" fill="#FFFFFF" />
  <circle cx="62" cy="60" r="2.5" fill="#2DD4BF" />
</svg>
