<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hs-logow-sphere-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="hs-logow-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="hs-logow-ecg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(4, 4) scale(0.92)">
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#hs-logow-sphere-bg)" />
    <circle cx="50" cy="50" r="34" stroke="url(#hs-logow-ring)" stroke-width="3.5" stroke-dasharray="160 40" stroke-linecap="round" opacity="0.6" />
    <path d="M 16 50 L 32 50 L 39 36 L 46 64 L 54 26 L 62 60 L 68 44 L 73 50 L 84 50" 
          stroke="url(#hs-logow-ecg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="54" cy="26" r="3.5" fill="#FFFFFF" />
    <circle cx="62" cy="60" r="2.5" fill="#99F6E4" />
  </g>

  <!-- Wordmark (white for dark backgrounds) -->
  <text x="108" y="62" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="#FFFFFF" letter-spacing="-0.5">
    Health<tspan fill="#2DD4BF">Sphere</tspan>
  </text>
</svg>
